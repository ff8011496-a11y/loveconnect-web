<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoveConnect</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial,sans-serif;
      background:linear-gradient(135deg,#ff4d6d,#ff8fab);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:#fff;
    }

    .container{
      text-align:center;
      padding:30px;
    }

    h1{
      font-size:42px;
      margin-bottom:10px;
    }

    p{
      font-size:18px;
      margin-bottom:25px;
    }

    button{
      padding:15px 35px;
      font-size:18px;
      border:none;
      border-radius:30px;
      background:#fff;
      color:#ff4d6d;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      background:#ffe5ec;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>❤️ LoveConnect</h1>
  <p>Find your perfect match.</p>

  <button onclick="startApp()">Get Started</button>
</div>

<script>
function startApp(){
  alert("Welcome to LoveConnect ❤️");
}
</script>

</body>
</html>
