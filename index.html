<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoveConnect</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ff4b6e,#ff7b9c);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:95%;
max-width:380px;
background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
text-align:center;
}

.logo{
font-size:45px;
}

h1{
color:#ff4b6e;
margin-top:10px;
}

p{
margin:15px 0;
color:#666;
}

input{
width:100%;
padding:14px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ff4b6e;
color:#fff;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#e63d61;
}

.link{
margin-top:15px;
color:#ff4b6e;
cursor:pointer;
font-size:15px;
}

.hidden{
display:none;
}
</style>

</head>
<body>

<div class="container">

<div id="home">

<div class="logo">❤️</div>

<h1>LoveConnect</h1>

<p>Find your perfect match.</p>

<button onclick="showLogin()">
Login
</button>

<button onclick="showSignup()">
Create Account
</button>

</div>

<div id="login" class="hidden">

<h2>Login</h2>

<input
type="email"
placeholder="Email">

<input
type="password"
placeholder="Password">

<button>
Login
</button>

<div
class="link"
onclick="showHome()">

← Back

</div>

</div>

<div id="signup" class="hidden">

<h2>Create Account</h2>

<input
type="text"
placeholder="Full Name">

<input
type="email"
placeholder="Email">

<input
type="password"
placeholder="Password">

<button>
Sign Up
</button>

<div
class="link"
onclick="showHome()">

← Back

</div>

</div>

</div>

<script>

function hideAll(){

document.getElementById("home").classList.add("hidden");

document.getElementById("login").classList.add("hidden");

document.getElementById("signup").classList.add("hidden");

}

function showHome(){

hideAll();

document.getElementById("home").classList.remove("hidden");

}

function showLogin(){

hideAll();

document.getElementById("login").classList.remove("hidden");

}

function showSignup(){

hideAll();

document.getElementById("signup").classList.remove("hidden");

}

</script>

</body>
</html>
